name: Build smoke test

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC (after profile update)
  pull_request:
    paths:
      - "update_map.sh"
      - "download_1inch_dem.py"
      - "generate_profiles.py"
      - "requirements.txt"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool wget unzip

      - name: Run full build (Monaco)
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: ./update_map.sh profiles/Europe/Monaco.conf

      - name: Verify output files exist
        run: |
          test -f output/Monaco/gmapsupp.img
          test -d output/Monaco/*.gmapi
          echo "gmapsupp.img size: $(stat --format='%s' output/Monaco/gmapsupp.img) bytes"
